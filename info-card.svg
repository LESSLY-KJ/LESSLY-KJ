an" font-weight="600">Projects  </tspan><tspan class="txt-muted">: </tspan><tspan class="txt-main">Ecommerce Big Data, NGO Analytics, Titanic EDA</tspan></text></g><g class="t" style="animation-delay:1.59s"><text x="24" y="206" font-size="13"><tspan class="txt-cyan" font-weight="600">Languages </tspan><tspan class="txt-muted">: </tspan><tspan class="txt-main">Python, SQL, R, Bash</tspan></text></g><g class="t" style="animation-delay:1.63s"><text x="24" y="230" font-size="13"><tspan class="txt-cyan" font-weight="600">Tools     </tspan><tspan class="txt-muted">: </tspan><tspan class="txt-main">Pandas, NumPy, Scikit-learn, Git, PowerBI / Excel</tspan></text></g><g class="t" style="animation-delay:1.67s"><rect x="24" y="242" width="26" height="13" rx="2" fill="#ff5f56"/><rect x="56" y="242" width="26" height="13" rx="2" fill="#ffbd2e"/><rect x="88" y="242" width="26" height="13" rx="2" fill="#27c93f"/><rect x="120" y="242" width="26" height="13" rx="2" fill="#58a6ff"/><rect x="152" y="242" width="26" height="13" rx="2" fill="#bc8cff"/><rect x="184" y="242" width="26" height="13" rx="2" fill="#f0883e"/><rect x="216" y="242" width="26" height="13" rx="2" fill="#39d353"/><rect x="248" y="242" width="26" height="13" rx="2" fill="#c9d1d9"/></g></svg>