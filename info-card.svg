  --bg-bot: #0d1117;
  --frame: #30363d;
  --sep: #30363d;
  --muted: #8b949e;
  --text: #e6edf3;
  --cyan: #58a6ff;
  --green: #39d353;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg-top: #ffffff;
