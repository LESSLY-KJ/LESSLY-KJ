<svg xmlns="http://www.w3.org/2000/svg" width="860" height="260" viewBox="0 0 860 260" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"><style>
:root {
  --bg-top: #111722;
  --tile-bg: #161b22;
  --frame: #30363d;
  --muted: #8b949e;
  --text: #e6edf3;
  --cyan: #58a6ff;
  --green: #39d353;
  --gold: #f2cc60;
  --purple: #bc8cff;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg-top: #ffffff;
    --tile-bg: #f6f8fa;
    --frame: #d0d7de;
    --muted: #656d76;
    --text: #1f2328;
    --cyan: #0969da;
    --green: #1a7f37;
    --gold: #9a6700;
    --purple: #8250df;
  }
}
.tile-box { fill: var(--tile-bg); stroke: var(--frame); stroke-width: 1.2px; }
.txt-muted { fill: var(--muted); }
.txt-title { fill: var(--text); }
.tag-cyan { fill: var(--cyan); }
.tag-green { fill: var(--green); }
.tag-gold { fill: var(--gold); }
.tag-purple { fill: var(--purple); }

.tile {
  opacity: 0;
  animation: tileSlide 0.22s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes tileSlide {
  0% {
    opacity: 0;
    transform: translateY(14px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (prefers-reduced-motion: reduce) {
  .tile { opacity: 1 !important; transform: none !important; animation: none !important; }
}
