0"><tspan class="txt-title">📫 Connect With Me</tspan></text><text class="tag-purple" x="455.0" y="185.0" font-size="10" font-weight="700" letter-spacing="0.5">NETWORKING • OPEN TO WORK</text><text class="txt-muted" x="455.0" y="211.0" font-size="11.5"><tspan x="455.0" dy="0">Always open to data analyst</tspan><tspan x="455.0" dy="16">collaborations, predictive modeling projects, and opportunities.</tspan></text></g></svg>