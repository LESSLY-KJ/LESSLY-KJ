<svg xmlns="http://www.w3.org/2000/svg" width="840" height="980" viewBox="0 0 840 980" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"><style>:root {
  --bg-top: #111722;
  --bg-bot: #0d1117;
  --tile-bg: #161b22;
  --badge-bg: #0d1117;
  --step-circle-bg: #21262d;
  --frame: #30363d;
  --sep: #30363d;
  --muted: #8b949e;
  --ink: #e6edf3;
  --green: #39d353;
  --accent: #58a6ff;
  --gold: #d29922;
  --purple: #bc8cff;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg-top: #ffffff;
    --bg-bot: #f6f8fa;
    --tile-bg: #ffffff;
    --badge-bg: #f6f8fa;
    --step-circle-bg: #eaeef2;
    --frame: #d0d7de;
    --sep: #d8dee4;
    --muted: #656d76;
    --ink: #1f2328;
    --green: #1a7f37;
    --accent: #0969da;
    --gold: #9a6700;
    --purple: #8250df;
  }
}
.card-frame { stroke: var(--frame); stroke-width: 1.2px; }
.tile-box { fill: var(--tile-bg); stroke: var(--frame); stroke-width: 1.2px; }
.sep-line { stroke: var(--sep); }
.txt-muted { fill: var(--muted); }
.txt-ink { fill: var(--ink); }
.txt-green { fill: var(--green); }
.txt-accent { fill: var(--accent); }
.txt-gold { fill: var(--gold); }
.txt-purple { fill: var(--purple); }

.tag-green { fill: var(--green); }
.tag-accent { fill: var(--accent); }
.tag-gold { fill: var(--gold); }
.tag-purple { fill: var(--purple); }

.badge-green { fill: var(--badge-bg); stroke: var(--green); stroke-width: 1.5px; }
.badge-accent { fill: var(--badge-bg); stroke: var(--accent); stroke-width: 1.5px; }
.badge-gold { fill: var(--badge-bg); stroke: var(--gold); stroke-width: 1.5px; }
.badge-purple { fill: var(--badge-bg); stroke: var(--purple); stroke-width: 1.5px; }

.circle-green { fill: var(--step-circle-bg); stroke: var(--green); stroke-width: 2.5px; }
.circle-accent { fill: var(--step-circle-bg); stroke: var(--accent); stroke-width: 2.5px; }
.circle-gold { fill: var(--step-circle-bg); stroke: var(--gold); stroke-width: 2.5px; }
.circle-purple { fill: var(--step-circle-bg); stroke: var(--purple); stroke-width: 2.5px; }

.fade-in {
  opacity: 0;
  animation: slideIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes slideIn {
  0% { opacity: 0; transform: translateY(14px); }
  100% { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .fade-in { opacity: 1 !important; transform: none !important; animation: none !important; }
}</style><defs><linearGradient id="bg_pipeline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bg-top)"/><stop offset="1" stop-color="var(--bg-bot)"/></linearGradient></defs><rect width="840" height="980" rx="12" fill="url(#bg_pipeline)"/><rect class="card-frame" x="0.6" y="0.6" width="838.8" height="978.8" rx="12" fill="none"/><line class="sep-line" x1="0" y1="36" x2="840" y2="36"/><circle cx="24" cy="18.0" r="5" fill="#ff5f56"/><circle cx="40" cy="18.0" r="5" fill="#ffbd2e"/><circle cx="56" cy="18.0" r="5" fill="#27c93f"/><text class="txt-muted" x="420.0" y="23.0" font-size="13" font-weight="600" text-anchor="middle">Analytics Methodology &amp; Pipeline</text><g class="fade-in" style="animation-delay: 1.00s"><text class="txt-ink" x="420.0" y="78" font-size="23" font-weight="800" text-anchor="middle">HOW I TURN RAW DATA INTO BUSINESS VALUE</text><text class="txt-muted" x="420.0" y="106" font-size="16" font-weight="500" text-anchor="middle">The 4-stage analytical framework applied across all my projects</text></g><g class="fade-in" style="animation-delay: 1.00s"><rect class="tile-box" x="20" y="142" width="800" height="148" rx="10"/><circle class="circle-accent" cx="62" cy="212.0" r="25"/><text class="txt-ink" x="62" y="220.0" font-size="22" font-weight="800" text-anchor="middle">1</text><text x="104" y="180" font-size="19" font-weight="800"><tspan class="tag-accent">STAGE 01</tspan><tspan class="txt-muted">  |  </tspan><tspan class="txt-ink">DATA INGESTION &amp; AUDIT</tspan></text><text class="txt-muted" x="104" y="217" font-size="15.5" font-weight="400">Connecting to databases, querying raw tables, handling missing values &amp; schema anomalies.</text><text class="tag-accent" x="104" y="259" font-size="14.5" font-weight="700" letter-spacing="0.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SQL • PANDAS • ETL PIPELINES</text><rect class="badge-green" x="557" y="232" width="245" height="38" rx="7"/><text class="tag-green" 