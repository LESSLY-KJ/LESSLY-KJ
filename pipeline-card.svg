<svg xmlns="http://www.w3.org/2000/svg" width="840" height="880" viewBox="0 0 840 880" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"><style>:root {
  --bg-top: #111722;
  --bg-bot: #0d1117;
  --tile-bg: #161b22;
  --badge-bg: #0d1117;
  --step-circle-bg: #21262d;
  --frame: #30363d;
  --sep: #30363d;
  --muted: #8b949e;
  --ink: #e6edf3;
  --green: #39d353;
  --accent: #58a6ff;
  --gold: #d29922;
  --purple: #bc8cff;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg-top: #ffffff;
    --bg-bot: #f6f8fa;
    --tile-bg: #ffffff;
    --badge-bg: #f6f8fa;
    --step-circle-bg: #eaeef2;
    --frame: #d0d7de;
    --sep: #d8dee4;
    --muted: #656d76;
    --ink: #1f2328;
    --green: #1a7f37;
    --accent: #0969da;
    --gold: #9a6700;
    --purple: #8250df;
  }
}
.card-frame { stroke: var(--frame); stroke-width: 1.2px; }
.tile-box { fill: var(--tile-bg); stroke: var(--frame); stroke-width: 1.2px; }
.sep-line { stroke: var(--sep); }
.txt-muted { fill: var(--muted); }
.txt-ink { fill: var(--ink); }
.txt-green { fill: var(--green); }
.txt-accent { fill: var(--accent); }
.txt-gold { fill: var(--gold); }
.txt-purple { fill: var(--purple); }

.tag-green { fill: var(--green); }
.tag-accent { fill: var(--accent); }
.tag-gold { fill: var(--gold); }
.tag-purple { fill: var(--purple); }

.badge-green { fill: var(--badge-bg); stroke: var(--green); stroke-width: 1px; }
.badge-accent { fill: var(--badge-bg); stroke: var(--accent); stroke-width: 1px; }
.badge-gold { fill: var(--badge-bg); stroke: var(--gold); stroke-width: 1px; }
.badge-purple { fill: var(--badge-bg); stroke: var(--purple); stroke-width: 1px; }

.circle-green { fill: var(--step-circle-bg); stroke: var(--green); stroke-width: 2px; }
.circle-accent { fill: var(--step-circle-bg); stroke: var(--accent); stroke-width: 2px; }
.circle-gold { fill: var(--step-circle-bg); stroke: var(--gold); stroke-width: 2px; }
.circle-purple { fill: var(--step-circle-bg); stroke: var(--purple); stroke-width: 2px; }

.fade-in {
  opacity: 0;
  animation: slideIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
}
@keyframes slideIn {
  0% { opacity: 0; transform: translateY(14px); }
  100% { opacity: 1; transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) {
  .fade-in { opacity: 1 !important; transform: none !important; animation: none !important; }
}</style><defs><linearGradient id="bg_pipeline" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bg-top)"/><stop offset="1" stop-color="var(--bg-bot)"/></linearGradient></defs><rect width="840" height="880" rx="12" fill="url(#bg_pipeline)"/><rect class="card-frame" x="0.6" y="0.6" width="838.8" height="878.8" rx="12" fill="none"/><line class="sep-line" x1="0" y1="34" x2="840" y2="34"/><circle cx="20" cy="17.0" r="5" fill="#ff5f56"/><circle cx="36" cy="17.0" r="5" fill="#ffbd2e"/><circle cx="52" cy="17.0" r="5" fill="#27c93f"/><text class="txt-muted" x="420.0" y="21.0" font-size="12" text-anchor="middle">Analytics Methodology &amp; Pipeline</text><g class="fade-in" style="animation-delay: 1.00s"><text class="txt-ink" x="420.0" y="74" font-size="19" font-weight="700" text-anchor="middle">HOW I TURN RAW DATA INTO BUSINESS VALUE</text><text class="txt-muted" x="420.0" y="98" font-size="13" text-anchor="middle">The 4-stage analytical framework applied across all my projects</text></g><g class="fade-in" style="animation-delay: 1.00s"><rect class="tile-box" x="20" y="140" width="800" height="135" rx="10"/><circle class="circle-accent" cx="60" cy="203.5" r="22"/><text class="txt-ink" x="60" y="209.5" font-size="18" font-weight="700" text-anchor="middle">1</text><text x="96" y="176" font-size="15" font-weight="700"><tspan class="tag-accent">STAGE 01</tspan><tspan class="txt-muted">  |  </tspan><tspan class="txt-ink">DATA INGESTION & AUDIT</tspan></text><text class="txt-muted" x="96" y="208" font-size="12.5">Connecting to databases, querying raw tables, handling missing values, and detecting anomalies.</text><text class="tag-accent" x="96" y="244" font-size="11" font-weight="700" letter-spacing="0.5">SQL • PANDAS • ETL</text><rect class="badge-green" x="570" y="222" width="230" height="32" rx="6"/><text class="tag-green" x="685.0" y="242" font-size="12" font-weight="700" text-anchor="middle">1.2M+ Records Cleaned</text></g><g class="fade-in" style="animation-delay: 1.05s"><text class="txt-muted" x="60" y="297" font-size="18" text-anchor="middle">↓</text></g><g class="fade-in" style="animation-delay: 1.15s"><rect class="tile-box" x="20" y="305" width="800" height="135" rx="10"/><circle class="circle-green" cx="60" cy="368.5" r="22"/><text class="txt-ink" x="60" y="374.5" font-size="18" font-weight="700" text-anchor="middle">2</text><text x="96" y="341" font-size="15" font-weight="700"><tspan class="tag-green">STAGE 02</tspan><tspan class="txt-muted">  |  </tspan><tspan class="txt-ink">EXPLORATORY DATA ANALYSIS (EDA)</tspan></text><text class="txt-muted" x="96" y="373" font-size="12.5">Uncovering distributions, hypothesis testing, identifying customer cohorts, and correlation matrix analysis.</text><text class="tag-green" x="96" y="409" font-size="11" font-weight="700" letter-spacing="0.5">NUMPY • STATS • VISUALIZATION</text><rect class="badge-accent" x="570" y="387" width="230" height="32" rx="6"/><text class="tag-accent" x="685.0" y="407" font-size="12" font-weight="700" text-anchor="middle">45+ Features Engineered</text></g><g class="fade-in" style="animation-delay: 1.20s"><text class="txt-muted" x="60" y="462" font-size="18" text-anchor="middle">↓</text></g><g class="fade-in" style="animation-delay: 1.30s"><rect class="tile-box" x="20" y="470" width="800" height="135" rx="10"/><circle class="circle-gold" cx="60" cy="533.5" r="22"/><text class="txt-ink" x="60" y="539.5" font-size="18" font-weight="700" text-anchor="middle">3</text><text x="96" y="506" font-size="15" font-weight="700"><tspan class="tag-gold">STAGE 03</tspan><tspan class="txt-muted">  |  </tspan><tspan class="txt-ink">PREDICTIVE MODELING & ML</tspan></text><text class="txt-muted" x="96" y="538" font-size="12.5">Supervised classification, clustering segmentation, and 5-fold cross-validation to guarantee model reliability.</text><text class="tag-gold" x="96" y="574" font-size="11" font-weight="700" letter-spacing="0.5">SCIKIT-LEARN • EVALUATION</text><rect class="badge-gold" x="570" y="552" width="230" height="32" rx="6"/><text class="tag-gold" x="685.0" y="572" font-size="12" font-weight="700" text-anchor="middle">86.4% Model ROC-AUC</text></g><g class="fade-in" style="animation-delay: 1.35s"><text class="txt-muted" x="60" y="627" font-size="18" text-anchor="middle">↓</text></g><g class="fade-in" style="animation-delay: 1.45s"><rect class="tile-box" x="20" y="635" width="800" height="135" rx="10"/><circle class="circle-purple" cx="60" cy="698.5" r="22"/><text class="txt-ink" x="60" y="704.5" font-size="18" font-weight="700" text-anchor="middle">4</text><text x="96" y="671" font-size="15" font-weight="700"><tspan class="tag-purple">STAGE 04</tspan><tspan class="txt-muted">  |  </tspan><tspan class="txt-ink">EXECUTIVE DASHBOARDING</tspan></text><text class="txt-muted" x="96" y="703" font-size="12.5">Translating mathematical outputs into interactive executive KPIs, churn monitors, and operational dashboards.</text><text class="tag-purple" x="96" y="739" font-size="11" font-weight="700" letter-spacing="0.5">POWER BI • EXCEL • REPORTS</text><rect class="badge-purple" x="570" y="717" width="230" height="32" rx="6"/><text class="tag-purple" x="685.0" y="737" font-size="12" font-weight="700" text-anchor="middle">12 Decision KPIs Built</text></g><g class="fade-in" style="animation-delay: 1.60s"><line class="sep-line" x1="20" y1="820" x2="820" y2="820"/><text class="txt-green" x="420.0" y="850" font-size="13" font-weight="700" text-anchor="middle">RESULT: Clean Code  •  Validated Science  •  Actionable Business Decisions</text></g></svg>